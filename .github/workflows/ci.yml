# PR마다(그리고 deploy.yml이 main 배포 전에 불러서) 프론트 테스트 → 백엔드 테스트·커버리지·전체 빌드 → E2E를 돌린다.
# main 보호 규칙에서 frontend, backend 작업을 필수로 지정한다(설계 8.2: 보안·동시성 테스트가 실패하면 합치지 않는다).
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 프론트 단위 테스트
        run: npx react-scripts test --watchAll=false
        env:
          CI: true

  backend:
    runs-on: ubuntu-latest
    # 테스트는 Testcontainers가 아니라 MySQL의 mycosmetic_test DB를 쓴다(계획서 "설계와 다르게 정한 것").
    # application-test.yml이 localhost:3306/mycosmetic_test에 계정 mycosmetic, 비밀번호 MYSQL_PASSWORD로 접속한다
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mycosmetic_test
          MYSQL_USER: mycosmetic
          MYSQL_PASSWORD: ci-only-password
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # CI 전용 값(실제 비밀 아님). 서비스 컨테이너의 MYSQL_PASSWORD와 같아야 한다
      MYSQL_PASSWORD: ci-only-password
      # 테스트 프로필은 application-test.yml의 테스트 키를 쓴다. 혹시 프로필 없이 뜨는 컨텍스트를 위한 같은 테스트 값
      JWT_SECRET: dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXMtLS0tLS0tLS0=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # bootJar가 프론트를 빌드해 JAR의 static/에 넣는다(build.gradle의 buildFrontend)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 저장소의 gradlew에 실행 권한 비트가 없다
      - run: chmod +x gradlew
      - name: 백엔드 테스트·service 커버리지 80% 확인·JAR 빌드
        run: ./gradlew check bootJar
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7
      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7
      # e2e 작업과 deploy.yml이 같은 JAR를 쓴다
      - name: JAR 업로드
        uses: actions/upload-artifact@v4
        with:
          name: mycosmetic-jar
          path: backend/build/libs/mycosmetic.jar
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: backend
    runs-on: ubuntu-latest
    # E2E는 e2e 프로필(가짜 AI)로 실제 JAR를 띄우고 mycosmetic_e2e DB를 쓴다(계획서 Task 26)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mycosmetic_e2e
          MYSQL_USER: mycosmetic
          MYSQL_PASSWORD: ci-only-password
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_PASSWORD: ci-only-password
      JWT_SECRET: dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXMtLS0tLS0tLS0=
    steps:
      - uses: actions/checkout@v4
      # e2e/가 아직 없으면(Task 26 전) 이 작업은 건너뛴 것으로 끝낸다
      - name: e2e 폴더 확인
        id: check
        run: |
          if [ -f e2e/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "e2e/package.json이 없어 E2E를 건너뜁니다"; fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.present == 'true'
        with:
          name: mycosmetic-jar
          path: backend/build/libs
      - name: Playwright 설치
        if: steps.check.outputs.present == 'true'
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E (폰·PC)
        if: steps.check.outputs.present == 'true'
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true
      - name: Playwright 리포트 업로드
        if: failure() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
