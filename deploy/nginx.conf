# /etc/nginx/conf.d/mycosmetic.conf 로 복사한다. YOUR_DOMAIN 을 실제 도메인으로 바꾼다:
#   sed 's/YOUR_DOMAIN/example.com/g' deploy/nginx.conf | sudo tee /etc/nginx/conf.d/mycosmetic.conf
# 인증서는 certbot(Let's Encrypt)이 /etc/letsencrypt/live/YOUR_DOMAIN/ 에 만든다(docs/deploy/aws.md 6단계).

# 도메인이 아닌 Host(IP 직접 접근, 다른 도메인)로 온 요청은 응답 없이 끊는다(444).
# 그래야 Host 헤더를 위조한 요청이 앱까지 가지 않는다
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	return 444;
}

# 443 기본 서버: 인증서 없이 TLS 핸드셰이크를 거절한다(SNI가 YOUR_DOMAIN이 아니면 끊김, nginx 1.19.4+)
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;
	ssl_reject_handshake on;
}

# 80: 모두 https로 보낸다
server {
	listen 80;
	listen [::]:80;
	server_name YOUR_DOMAIN;

	location / {
		return 301 https://$host$request_uri;
	}
}

# 443: 같은 서버의 Spring Boot 컨테이너(127.0.0.1:8080)로 전달한다
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name YOUR_DOMAIN;

	ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;

	# HSTS는 nginx에서 붙이지 않는다. Spring Security가 https 요청(X-Forwarded-Proto: https)에
	# Strict-Transport-Security: max-age=31536000 ; includeSubDomains 를 이미 붙이므로 여기서도 붙이면 헤더가 두 번 나간다.
	# 다른 보안 헤더(X-Content-Type-Options, X-Frame-Options 등)와 함께 한곳(앱)에서 관리한다

	# 전성분 사진 업로드: 앱의 max-request-size(6MB)와 같게
	client_max_body_size 6m;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# 앱은 server.forward-headers-strategy: framework 로 이 값을 보고 https 주소(카카오 redirect_uri 등)를 만든다
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Port $server_port;
		# 앱(ForwardedHeaderFilter)이 읽는 나머지 전달 헤더는 클라이언트가 보낸 값을 지운다(주소·스킴 위조 방지)
		proxy_set_header Forwarded "";
		proxy_set_header X-Forwarded-Prefix "";
		proxy_set_header X-Forwarded-Ssl "";
	}
}
