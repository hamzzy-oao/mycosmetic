# 로컬 MySQL의 테스트 전용 DB. 컨텍스트가 뜰 때 TestDatabaseConfig가 clean → migrate 한다
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mycosmetic_test?serverTimezone=Asia/Seoul
  flyway:
    clean-disabled: false
# 테스트에서 실제 Claude를 부르지 않도록 저장해 둔 결과를 돌려주는 가짜 client를 쓴다
app.extraction.client: fake
# 테스트 전용 JWT 서명 키(실제 키 아님). Base64로 디코딩하면 38바이트
app.jwt.secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXMtLS0tLS0tLS0=
# 테스트 중 식약처 주간 배치 등 @Scheduled 작업이 돌지 않게 한다(필요하면 테스트에서 메서드를 직접 부른다)
app.scheduling.enabled: false
# 요청 로그 필드(userId·traceId 등)를 검사하는 테스트가 있어 운영(Docker)과 같은 JSON 형식으로 남긴다
logging.structured.format.console: logstash
