plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mycosmetic'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'com.anthropic:anthropic-java:2.75.0'
	implementation 'org.apache.commons:commons-text:1.15.0'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 커버리지(설계 8장): service 계층 LINE 80% 이상. check가 검증에 의존하므로 CI의 ./gradlew check에서 미달이면 실패한다
def serviceClasses = { sourceSets.main.output.classesDirs.asFileTree.matching { include 'com/mycosmetic/service/**' } }

tasks.named('jacocoTestReport') {
	dependsOn 'test'
	classDirectories.setFrom(serviceClasses())
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn 'test'
	classDirectories.setFrom(serviceClasses())
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

tasks.named('test') {
	finalizedBy 'jacocoTestReport'
}

tasks.named('check') {
	dependsOn 'jacocoTestCoverageVerification'
}

// 프론트(CRA) 빌드 결과를 JAR의 static/에 넣는다. -PskipFrontend면 건너뛴다
def frontendDir = file('../frontend')
def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
def skipFrontend = project.hasProperty('skipFrontend')

tasks.register('npmCi', Exec) {
	onlyIf { !skipFrontend }
	workingDir = frontendDir
	commandLine npm, 'ci'
	inputs.file("${frontendDir}/package-lock.json")
	outputs.dir("${frontendDir}/node_modules")
}

tasks.register('buildFrontend', Exec) {
	onlyIf { !skipFrontend }
	dependsOn 'npmCi'
	workingDir = frontendDir
	commandLine npm, 'run', 'build'
	inputs.dir("${frontendDir}/src")
	inputs.dir("${frontendDir}/public")
	inputs.file("${frontendDir}/package.json")
	outputs.dir("${frontendDir}/build")
}

tasks.named('processResources') {
	if (!skipFrontend) {
		dependsOn 'buildFrontend'
		from("${frontendDir}/build") {
			into 'static'
		}
	}
}

tasks.named('bootJar') {
	archiveFileName = 'mycosmetic.jar'
}

// Flyway SQL은 저장소 루트 DB/migration/에 둔다. 클래스패스 migration/으로 들어가고(JAR·이클립스 공통),
// DB/local/의 로컬 설정 스크립트는 넣지 않는다
sourceSets {
	main {
		resources {
			srcDir '../DB'
			exclude 'local/**'
		}
	}
}
